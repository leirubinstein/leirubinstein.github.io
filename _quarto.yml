project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "posts/**/*.ipynb"
  resources:
    - .nojekyll
    - cv/Rubinstein_Leilanie_CV.pdf

website:
  title: "Leilanie Rubinstein"
  description: "Environmental data scientist working on remote sensing, machine learning, and environmental policy."
  site-url: https://leirubinstein.github.io
  repo-url: https://github.com/leirubinstein/leirubinstein.github.io
  favicon: images/favicon.svg
  open-graph: true
  navbar:
    logo: images/logo.png
    logo-alt: "Leilanie Rubinstein logo"
    left:
      - text: Home
        href: index.qmd
      - text: CV
        href: cv.qmd
      - text: Blog
        href: blog.qmd
      - text: Photos
        href: photos.qmd
    right:
      - icon: github
        href: https://github.com/leirubinstein
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/leilanie-rubinstein/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:leilanierubinstein@gmail.com
        aria-label: Email
      - icon: rss
        href: blog.xml
        aria-label: RSS feed
  page-footer:
    left: "© 2026 Leilanie Rubinstein"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:  # dark is listed first, so it is the default
      dark: [slate, styles/dark.scss]
      light: [litera, styles/light.scss]
    css: styles/site.css
    toc: true
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: true
    highlight-style: github
